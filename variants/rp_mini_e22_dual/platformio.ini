[rp_mini_e22_dual]
extends = rp2040_base
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  ${rp2040_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rp_mini_e22_dual
;  -D PICO
  -D ENV_INCLUDE_GPS=0
  -D HW_SPI1_DEVICE
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=10
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=14
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=15
  -D SX126X_RXEN=6
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=130
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_2_DIO_1=20
  -D P_LORA_2_NSS=17
  -D P_LORA_2_RESET=21
  -D P_LORA_2_BUSY=22
  -D P_LORA_2_SCLK=18
  -D P_LORA_2_MISO=16
  -D P_LORA_2_MOSI=19
  -D SX126X_2_RXEN=28
  -D LORA_2_FREQ=433.775
build_src_filter = ${rp2040_base.build_src_filter}
  +<PicoWBoard.cpp>
  +<helpers/sensors>
  +<../variants/rp_mini_e22_dual>
lib_deps =
  ${rp2040_base.lib_deps}
  ${sensor_base.lib_deps}

[env:rp_mini_e22_dual_repeater]
extends = rp_mini_e22_dual
build_flags = ${rp_mini_e22_dual.build_flags}
  -D ADVERT_NAME='"RP2040-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rp_mini_e22_dual.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${rp_mini_e22_dual.lib_deps}
  https://github.com/iontodirel/libaprs.git
