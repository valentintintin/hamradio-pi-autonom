; ============================================================================
; RP-LoRA_Mini_v3_dual — Dual SX1262 (433 APRS + 868 MeshCore)
; Board: Custom PCB by F4ISE, RP2040 (Pico W)
; ============================================================================

[platformio]
default_envs = rp2040_lora_dual
src_dir = src

; --- Base Arduino config (inherited from MeshCore) --------------------------
[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  jgromes/RadioLib @ ^7.6.0
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1

; --- RP2040 base ------------------------------------------------------------
[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0d
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; --- MeshCore source filter (noyau seulement) -------------------------------
[meshcore_src]
build_src_filter =
  +<../lib/MeshCore/lib/ed25519/*.c>
  ; MyMesh vient tel quel de l'exemple MeshCore simple_repeater — pas de copie
  ; locale (cf. src/mesh/MeshcoreRepeater.h qui en hérite), pour rester
  ; synchronisé avec l'upstream sans divergence silencieuse.
  +<../lib/MeshCore/examples/simple_repeater/MyMesh.cpp>
build_flags =
  -I lib/MeshCore/src
  -I lib/MeshCore/src/helpers
  -I lib/MeshCore/src/helpers/radiolib
  -I lib/MeshCore/lib/ed25519
  -I lib/MeshCore/examples/simple_repeater
  -D ADVERT_NAME='"F4ISE LoRa Dual"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
; Debug (decommenter si besoin)
; -D MESH_DEBUG=1
; -D MESH_PACKET_LOGGING=1

; ============================================================================
; LORA 868 — MeshCore radio (SPI1, E22-900M30S)
; ============================================================================
[lora_868]
build_flags =
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  ; SPI1 pins
  -D P_LORA_SCLK=14
  -D P_LORA_MOSI=15
  -D P_LORA_MISO=12
  -D P_LORA_NSS=13
  ; Control pins
  -D P_LORA_DIO_1=11
  -D P_LORA_BUSY=7
  -D P_LORA_RESET=10
  -D SX126X_RXEN=6
  ; Radio config
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=22
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5

; ============================================================================
; LORA 433 — APRS radio (SPI0, E22-400M33S)
; ============================================================================
[lora_433]
build_flags =
  ; SPI0 pins
  -D P_APRS_SCLK=18
  -D P_APRS_MOSI=19
  -D P_APRS_MISO=16
  -D P_APRS_NSS=17
  ; Control pins
  -D P_APRS_DIO_1=20
  -D P_APRS_BUSY=22
  -D P_APRS_RESET=21
  -D APRS_RXEN=28
  ; Radio config
  -D APRS_DIO2_AS_RF_SWITCH=true
  -D APRS_DIO3_TCXO_VOLTAGE=1.8
  -D APRS_RX_BOOSTED_GAIN=1
  -D APRS_CURRENT_LIMIT=140
  -D APRS_TX_POWER=22
  -D APRS_FREQ=433.775
  -D APRS_BW=125.0
  -D APRS_SF=12
  -D APRS_CR=5

; ============================================================================
; Main environment
; ============================================================================
[env:rp2040_lora_dual]
extends = rp2040_base
board = rpipicow
board_build.filesystem_size = 0.5m

build_flags = ${rp2040_base.build_flags}
  ${meshcore_src.build_flags}
  ${lora_868.build_flags}
  ${lora_433.build_flags}
  -I variant
  ; FreeRTOS
  -D __FREERTOS=1

build_src_filter = ${meshcore_src.build_src_filter}
  +<*>
  +<../variant/**>

lib_deps = ${rp2040_base.lib_deps}
  adafruit/Adafruit BME280 Library @ ^2.2.2
  adafruit/Adafruit INA3221 Library @ ^1.0.0
  https://github.com/T88T/VictronVEDirectArduino.git
