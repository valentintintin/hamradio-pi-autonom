; ============================================================================
; RP-LoRA_Mini_v3_dual — Dual SX1262 (433 APRS + 868 MeshCore)
; Board: Custom PCB by F4ISE, RP2040 (Pico W)
; ============================================================================

[platformio]
default_envs = rp2040_lora_dual
src_dir = src

; --- Base Arduino config (inherited from MeshCore) --------------------------
[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  jgromes/RadioLib @ ^7.6.0
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1

; --- RP2040 base ------------------------------------------------------------
[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0d
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; --- MeshCore source filter (noyau seulement) -------------------------------
[meshcore_src]
build_src_filter =
  +<../lib/MeshCore/lib/ed25519/*.c>
  ; MyMesh vient tel quel de l'exemple MeshCore simple_repeater — pas de copie
  ; locale (cf. src/mesh/MeshcoreRepeater.h qui en hérite), pour rester
  ; synchronisé avec l'upstream sans divergence silencieuse.
  +<../lib/MeshCore/examples/simple_repeater/MyMesh.cpp>
build_flags =
  -I lib/MeshCore/src
  -I lib/MeshCore/src/helpers
  -I lib/MeshCore/src/helpers/radiolib
  -I lib/MeshCore/lib/ed25519
  -I lib/MeshCore/examples/simple_repeater
  ; Contrairement à src/ et variant/, les fichiers MeshCore ne reçoivent pas
  ; automatiquement le -I du src_dir du projet (cf. PlatformIO) — nécessaire
  ; depuis que RadioLibWrappers.cpp inclut core/RadioActivityNotify.h (seule
  ; modification locale de ce fichier vendoré, cf. ce header).
  -I src
  -D MAX_NEIGHBOURS=50
  -D MAX_GROUP_CHANNELS=8
; Debug (decommenter si besoin)
; -D MESH_DEBUG=1
; -D MESH_PACKET_LOGGING=1

; ============================================================================
; LORA 868 — MeshCore radio (SPI1, E22-900M30S)
; ============================================================================
[lora_868]
build_flags =
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  ; SPI1 pins
  -D P_LORA_SCLK=14
  -D P_LORA_MOSI=15
  -D P_LORA_MISO=12
  -D P_LORA_NSS=13
  ; Control pins
  -D P_LORA_DIO_1=11
  -D P_LORA_BUSY=7
  -D P_LORA_RESET=10
  -D SX126X_RXEN=6
  ; Radio config
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=22
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5

; ============================================================================
; LORA 433 — APRS radio (SPI0, E22-400M33S)
; ============================================================================
[lora_433]
build_flags =
  ; SPI0 pins
  -D P_APRS_SCLK=18
  -D P_APRS_MOSI=19
  -D P_APRS_MISO=16
  -D P_APRS_NSS=17
  ; Control pins
  -D P_APRS_DIO_1=20
  -D P_APRS_BUSY=22
  -D P_APRS_RESET=21
  -D APRS_RXEN=28
  ; Radio config
  -D APRS_DIO2_AS_RF_SWITCH=true
  -D APRS_DIO3_TCXO_VOLTAGE=1.8
  -D APRS_RX_BOOSTED_GAIN=1
  -D APRS_CURRENT_LIMIT=140
  -D APRS_TX_POWER=22
  -D APRS_FREQ=433.775
  -D APRS_BW=125.0
  -D APRS_SF=12
  -D APRS_CR=5

; ============================================================================
; Main environment
; ============================================================================
[env:rp2040_lora_dual]
extends = rp2040_base
board = rpipicow
board_build.filesystem_size = 0.5m

build_flags = ${rp2040_base.build_flags}
  ${meshcore_src.build_flags}
  ${lora_868.build_flags}
  ${lora_433.build_flags}
  -I variant
  ; FreeRTOS
  -D __FREERTOS=1

build_src_filter = ${meshcore_src.build_src_filter}
  +<*>
  +<../variant/**>

lib_deps = ${rp2040_base.lib_deps}
  adafruit/Adafruit BME280 Library @ ^2.2.2
  adafruit/Adafruit INA3221 Library @ ^1.0.0
  https://github.com/T88T/VictronVEDirectArduino.git
  robtillaart/TCA9555 @ ^0.4.4
  densaugeo/base64 @ ~1.4.0
  ; Uniquement référencée depuis variant/ExternalRtcReal.h (pas depuis src/) :
  ; la LDF en mode chain (par défaut ici, cf. lib_ldf_mode) ne scanne que
  ; depuis src_dir, donc ne la découvrirait jamais sans cette ligne.
  Rx8025tRtc

; ============================================================================
; ENV NATIF — compile et exécute src/ sur l'hôte (dev sans matériel), avec
; simulateur de tous les périphériques : capteurs I2C/GPIO/chargeur solaire
; simulés en mémoire (native_sim/compat/Adafruit_*.h, TCA9555.h, VEDirect.h,
; mpptChg.h — faux vendor headers, lib/mpptChg réel exclu via lib_ignore),
; EEPROM et LittleFS persistés dans de vrais fichiers sous SIM_DATA_DIR
; (défaut "native-data") :
;   SIM_DATA_DIR/littlefs/...                     — 1 fichier par chemin LittleFS
;                                                    (settings.json lisible, cf.
;                                                    native_sim/sim/SimSettingsJson)
;   SIM_DATA_DIR/eeprom/settings.json              — copie EEPROM des settings
;   SIM_DATA_DIR/eeprom/telemetry_history/*.json   — 1 fichier par entrée d'historique
;   SIM_DATA_DIR/eeprom/event_log/*.json           — 1 fichier par événement journalisé
; (JSON plutôt que binaire brut, pour rester inspectable/éditable directement
; — cf. native_sim/sim/M24M01HalSim.cpp, qui remplace hal/eeprom/M24M01Hal.cpp
; pour cet env). Radios LoRa remplacées
; par SimRadio (native_sim/sim/, mesh::Radio simulé — TX loggé, RX injecté via
; CLI "sim rx ..." ou le dashboard web). Pas de framework Arduino/RadioLib/
; FreeRTOS réels : native_sim/compat/ fournit des shims minimaux (cf.
; commentaires de ces fichiers). CLI série inchangé (stdin/stdout).
;
; Interface web : un vrai serveur HTTP séparé, native_sim/web/server.py
; (Python 3 stdlib, aucune dépendance) — sert native_sim/web/static/ et lit/
; écrit SIM_DATA_DIR/web/ (état JSON + fichiers de commande), cf.
; native_sim/web/SimWebBridge.cpp côté simulateur. Port : SIM_WEB_PORT
; (défaut 8088, à passer aux DEUX process s'il est changé côté simulateur —
; en pratique seul server.py en a besoin, le simulateur ne fait plus que
; lire/écrire des fichiers).
;
; Usage :
;   pio run -e native -t exec &          (ou .pio/build/native/program &)
;   python3 native_sim/web/server.py     (depuis la racine du projet, ou
;                                          SIM_DATA_DIR=... si personnalisé)
; ============================================================================
[env:native]
platform = native
build_type = debug
; deep+ : MyMesh.cpp/.h (lib/MeshCore/examples/...) est injecté hors src_dir
; via build_src_filter — la LDF en mode chain (par défaut) ne le prend pas
; comme racine de scan et ne détecte donc pas ses #include (RTClib...) ;
; deep+ scanne tous les fichiers de toutes les libs sans ce problème.
lib_ldf_mode = deep+
; Pas de `framework =` ici (on ne veut pas de framework-portduino, qui
; entrerait en conflit avec native_sim/compat/Arduino.h) — mais Crypto/
; RTClib/CayenneLPP/base64 déclarent `"frameworks": ["arduino"]` dans leur
; library.json et seraient sinon jugés incompatibles par la LDF et ignorés
; silencieusement (d'où les "fatal error: Ed25519.h/RTClib.h: introuvable").
lib_compat_mode = off

build_flags = ${meshcore_src.build_flags}
  -std=gnu++17
  -D NATIVE_BUILD=1
  -D RP2040_PLATFORM
  ; Adafruit BusIO (dépendance de RTClib pour RTC_DS3231 etc.) : force sa
  ; branche "SW SPI only" (pas de <SPI.h>/SPIClass réel nécessaire, on ne
  ; parle jamais réellement en SPI en natif).
  -D SPI_INTERFACES_COUNT=0
  ; CayenneLPPPolyline.h ne #include <cstdint> que sous ESP-IDF
  ; (#if !defined(ARDUINO) && defined(IDF_VER)) — ni l'un ni l'autre ici ;
  ; -include l'apporte globalement plutôt que de patcher la lib vendor.
  ; stdint.h (pas cstdint) : valide aussi pour les .c (ed25519).
  -include stdint.h
  -I native_sim/compat
  -I native_sim/sim
  -I native_sim/web
  -I variant_native
  -I variant
  -lpthread

; MeshCore n'est PAS traité comme une lib auto-découverte ici (lib_ignore
; ci-dessous) : on choisit nous-mêmes exactement quels .cpp de lib/MeshCore/
; entrent dans le build natif, pour exclure helpers/radiolib/*.cpp (RadioLib
; réel, non nécessaire — cf. native_sim/sim/SimRadio.h qui implémente mesh::Radio
; directement) sans devoir patcher lib/MeshCore/build_as_lib.py.
build_src_filter = ${meshcore_src.build_src_filter}
  +<*>
  +<../native_sim/compat/*.cpp>
  +<../native_sim/sim/*.cpp>
  +<../native_sim/web/*.cpp>
  +<../variant_native/**>
  +<../variant/MyBoard.cpp>
  +<../lib/MeshCore/src/*.cpp>
  +<../lib/MeshCore/src/helpers/*.cpp>
  -<../lib/MeshCore/src/helpers/NRF52Board.cpp>
  -<../lib/MeshCore/src/helpers/ESP32Board.cpp>
  ; Implémentations natives dédiées sous native_sim/sim/ (mêmes classes,
  ; backées par SimWorld plutôt que par un vrai bus/lib vendor) — cf.
  ; M24M01HalSim.cpp, SettingsCodecSim.cpp. Exclut les originaux "réels"
  ; pour éviter une double définition (les deux seraient sinon inclus par
  ; le "+<*>" ci-dessus et le glob native_sim/sim/*.cpp).
  -<hal/eeprom/M24M01Hal.cpp>
  -<config/SettingsCodec.cpp>
  ; BaseChatMesh (chat/companion apps, pas simple_repeater) : non utilisé par
  ; MyMesh.cpp mais définit les mêmes symboles non-inline que base64.hpp que
  ; MeshcoreRepeater.cpp inclut aussi -> double définition à l'édition de
  ; liens si les deux sont compilés.
  -<../lib/MeshCore/src/helpers/BaseChatMesh.cpp>

; RadioLib est textuellement référencé par des #include sous #ifndef
; NATIVE_BUILD (LoRa433RadioMode.cpp, SstvTransmitter.cpp, task_weather.cpp)
; que le préprocesseur natif n'active jamais — mais la LDF (analyse
; textuelle, pas préprocesseur) le détecterait quand même sans cette ligne.
; mpptChg : lib vendorée (lib/mpptChg/) ignorée ici au profit de sa
; contrepartie native_sim/compat/mpptChg.h (même principe que Adafruit_BME280.h/
; Adafruit_INA3221.h/TCA9555.h/VEDirect.h — un faux header vendor qui parle
; directement à SimWorld) — le vrai driver ne parlerait à rien (Wire.h natif
; ci-dessus est un no-op) et n'a donc aucune raison d'être compilé ici.
lib_ignore = MeshCore, RadioLib, mpptChg

lib_deps =
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
  ; Sérialisation JSON de native_sim/web/SimWebBridge.cpp (état exporté vers
  ; le dashboard) — déjà tirée transitivement par CayenneLPP, mais listée ici
  ; explicitement puisqu'on en dépend directement.
  bblanchon/ArduinoJson @ ^7.4.3